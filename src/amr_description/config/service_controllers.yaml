controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    # Rear wheels with BLDC motors (must match service_robot.urdf.xacro)
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.47
    wheel_radius: 0.075

    enable_odom_tf: false  # EKF (robot_localization) owns odom->base_link
    odom_frame_id: odom
    base_frame_id: base_link
    publish_rate: 50.0

    # Service robot limits: walking pace, gentle on cups and plates
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.2
    linear.x.max_acceleration: 0.4
    linear.x.max_deceleration: -0.6
    linear.x.max_acceleration_reverse: -0.4
    linear.x.max_deceleration_reverse: 0.6

    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.5
    angular.z.max_deceleration: -1.5
    angular.z.max_acceleration_reverse: -1.5
    angular.z.max_deceleration_reverse: 1.5

    cmd_vel_timeout: 0.5

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
