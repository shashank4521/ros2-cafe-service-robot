controller_manager:

  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint
    right_wheel_names:
      - right_wheel_joint
    wheel_separation: 0.800
    wheel_radius: 0.125
    enable_odom_tf: false  # EKF (robot_localization) owns odom->base_link
    linear.x.max_velocity: 0.10
    linear.x.min_velocity: -0.10
    linear.x.max_acceleration: 0.10
    linear.x.max_acceleration_reverse: -0.10
    linear.x.max_deceleration: -0.10
    linear.x.max_deceleration_reverse: 0.10

    angular.z.max_velocity: 0.10
    angular.z.min_velocity: -0.10
    angular.z.max_acceleration: 0.10
    angular.z.max_acceleration_reverse: -0.10
    angular.z.max_deceleration: -0.10
    angular.z.max_deceleration_reverse: 0.10
    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01

    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01
