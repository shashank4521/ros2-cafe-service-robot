# dual_laser_merger: front + rear LiDAR -> /merged (frame base_link)
#
# The merger already reads each LiDAR's pose from TF (URDF:
# front_lidar_link at x=+0.7, rear_lidar_link at x=-0.7 with yaw=pi).
# The *_offset values are extra calibration corrections applied ON TOP
# of TF, so they must be 0 here. Non-zero values (0.7 / -0.7 / -pi)
# pushed the front scan 0.7 m forward and flipped the rear scan to face
# forward, which scattered the SLAM map (fixed 23 Oct 2026).
amr_dual_laser_merger:
  ros__parameters:
    use_sim_time: true

    laser_1_topic: /front_lidar
    laser_2_topic: /rear_lidar
    merged_scan_topic: merged
    merged_cloud_topic: merged_cloud
    target_frame: base_link

    enable_calibration: false
    laser_1_x_offset: 0.0
    laser_1_y_offset: 0.0
    laser_1_yaw_offset: 0.0
    laser_2_x_offset: 0.0
    laser_2_y_offset: 0.0
    laser_2_yaw_offset: 0.0

    tolerance: 0.01
    queue_size: 5
    angle_increment: 0.00873
    scan_time: 0.067
    range_min: 0.1
    range_max: 12.0
    min_height: -1.0
    max_height: 1.0
    angle_min: -3.141592654
    angle_max: 3.141592654
    inf_epsilon: 1.0
    use_inf: true
    allowed_radius: 0.45
    enable_shadow_filter: true
    enable_average_filter: true
